<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 410" role="img" aria-labelledby="title desc">
<title id="title">Estaca Teresina Brasil Horto</title>
<desc id="desc">Desenho linear assimétrico da capela da Estaca Horto, com torre deslocada à esquerda e nome abaixo.</desc>
<g transform="translate(31 320) scale(4.5 -4.5)" fill="none" stroke="#21483e" stroke-width=".35" stroke-linecap="square" stroke-linejoin="miter">
  <!-- corpo, beiral, platibanda e pilares das extremidades -->
  <path d="M0 0 V16 H100 V0 M0 21 H29 M53 21 H100 M0 16 H100"/>
  <path d="M0 16 V22 H1.3 V16 M98.7 16 V22 H100 V16"/>
  <!-- linha de base dupla e peitoril -->
  <path d="M0 0 H100 M0 -.8 H100 M0 2.4 H100"/>
  <!-- pilastras -->
  <path d="M9 0 V16 M17 0 V16 M29 0 V16 M30 0 V16 M31 0 V16 M53 0 V16 M75 0 V16 M88 0 V16"/>
  <!-- frontão central e torre -->
  <path d="M29 16 L41 21.6 L53 16 M29 15.3 L41 20.9 L53 15.3"/>
  <path d="M36.25 21.6 H45.75 V23.4 H36.25 Z M37 23.4 H45 V24.2 H37 Z"/>
  <path d="M38.5 24.2 H43.5 V26 H38.5 Z"/>
  <path d="M39.5 26 A1.5 1.5 0 0 0 42.5 26"/>
  <path d="M39.5 26 L39.5 27.2 L41 41 L42.5 27.2 L42.5 26"/>
  <!-- frontões laterais -->
  <path d="M9 16 L13 19.5 L17 16 M75 16 L81.5 19.5 L88 16"/>
  <!-- janelas em arco: 4 à esquerda e 6 à direita -->
  <path d="M3.15 2.4 V11.25 A1.75 1.75 0 0 1 6.65 11.25 V2.4 Z
           M11.05 2.4 V11.25 A1.75 1.75 0 0 1 14.55 11.25 V2.4 Z
           M18.75 2.4 V11.25 A1.75 1.75 0 0 1 22.25 11.25 V2.4 Z
           M23.55 2.4 V11.25 A1.75 1.75 0 0 1 27.05 11.25 V2.4 Z
           M54.85 2.4 V11.25 A1.75 1.75 0 0 1 58.35 11.25 V2.4 Z
           M59.85 2.4 V11.25 A1.75 1.75 0 0 1 63.35 11.25 V2.4 Z
           M65.45 2.4 V11.25 A1.75 1.75 0 0 1 68.95 11.25 V2.4 Z
           M70.35 2.4 V11.25 A1.75 1.75 0 0 1 73.85 11.25 V2.4 Z
           M76.95 2.4 V11.25 A1.75 1.75 0 0 1 80.45 11.25 V2.4 Z
           M82.05 2.4 V11.25 A1.75 1.75 0 0 1 85.55 11.25 V2.4 Z"/>
  <!-- porta central em arco, contorno mais grosso -->
  <path d="M37.8 1.4 V10.7 A3.2 3.2 0 0 1 44.2 10.7 V1.4 Z" stroke-width=".7"/>
  <!-- porta lateral direita com dois painéis -->
  <path d="M91 1.5 V12.5 H97 V1.5 Z M91.35 7 H96.65 M91.7 1.8 V12.2 M96.3 1.8 V12.2"/>
  <!-- pequenos reforços da platibanda e peitoril entre vãos -->
  <path d="M0 2.4 H3.15 M6.65 2.4 H11.05 M14.55 2.4 H18.75 M22.25 2.4 H23.55 M27.05 2.4 H37.8 M44.2 2.4 H54.85 M58.35 2.4 H59.85 M63.35 2.4 H65.45 M68.95 2.4 H70.35 M73.85 2.4 H76.95 M80.45 2.4 H82.05 M85.55 2.4 H91 M97 2.4 H100"/>
</g>
<text x="256" y="377" text-anchor="middle" fill="#21483e" font-family="Montserrat, Arial, sans-serif" font-size="15.5" font-weight="800" letter-spacing=".25">ESTACA TERESINA BRASIL HORTO</text>
</svg>